[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debrief"
version = "0.1.0"
description = "Grounded incident briefs: ASRS data, QLoRA, evaluation, and local inference"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PyYAML==6.0.3",
    "huggingface-hub==0.36.2",
    "transformers==4.57.6",
    "datasets==4.3.0",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[project.scripts]
debrief = "src.infer:main"
debrief-build = "src.build_dataset:main"
debrief-eval = "src.eval_briefs:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

